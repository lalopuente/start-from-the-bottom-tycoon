<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050817">
<title>Start from the Bottom Tycoon</title>
<style>
:root{--bg:#040817;--panel:#08132b;--panel2:#0c1835;--line:#087cff;--cyan:#42f5ff;--purple:#a13dff;--gold:#ffd166;--green:#20e875;--pink:#ff3fe1;--text:#f5f7ff;--muted:#b5c6e7;--danger:#ff4568}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 50% -20%,#20205d 0,transparent 48%),linear-gradient(140deg,#050918,#07112a 50%,#100825);padding:8px 10px 16px;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:2px}.app{max-width:1700px;margin:auto}.topbar{display:grid;grid-template-columns:140px minmax(170px,1.25fr) repeat(3,minmax(115px,.85fr)) minmax(210px,1.2fr);gap:8px;align-items:stretch;margin-bottom:9px}.back,.stat,.levelbox,.brand{border:1px solid #2b64b7;border-radius:13px;background:linear-gradient(135deg,#0b1734,#080d22);box-shadow:inset 0 0 12px #087cff14,0 0 12px #087cff22;min-width:0}.back{font-weight:900;color:var(--cyan);font-size:17px}.brand{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px;color:var(--gold);font-weight:1000;text-align:center;line-height:.95;font-size:clamp(15px,1.7vw,25px);text-shadow:0 0 13px #ff9b00}.brand span{display:block;font-size:10px;color:#fff;letter-spacing:3px;margin-top:5px}.stat{display:flex;align-items:center;justify-content:center;gap:9px;padding:8px}.stat .ico{font-size:clamp(22px,2.5vw,36px)}.stat strong{display:block;color:var(--cyan);font-size:clamp(13px,1.5vw,22px);white-space:nowrap}.stat small{display:block;text-align:center;font-size:10px;color:#e1e9ff;letter-spacing:.5px}.stat.income strong{color:var(--gold)}.stat.life strong{color:#f4dcff}.levelbox{display:flex;align-items:center;gap:9px;padding:8px}.crown{font-size:28px;border:2px solid var(--gold);border-radius:50%;padding:7px;box-shadow:0 0 12px #a13dff}.levelbox strong{display:block;color:var(--gold);font-size:clamp(12px,1.4vw,19px)}.levelbox small{color:var(--muted);font-size:10px}.xp{height:8px;border:1px solid #6853c8;background:#020616;border-radius:20px;overflow:hidden;margin-top:5px}.xp span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8c00);width:0;transition:width .3s}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:10px}.sidebar{display:flex;flex-direction:column;gap:6px}.nav{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;min-height:47px;border:1px solid #1265b3;border-radius:10px;background:linear-gradient(110deg,#071c3b,#0b102b);font-weight:750;box-shadow:inset 0 0 8px #0c8cff15}.nav .icon{font-size:25px;width:30px;text-align:center}.nav.active{border-color:var(--cyan);background:linear-gradient(100deg,#0758c8,#4012a1);box-shadow:0 0 14px #087cffaa,inset 0 0 10px #42f5ff55}.main{min-width:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.85fr);gap:10px;align-content:start}.feature,.rightpanel,.tile,.activity{min-width:0;border:1px solid #155bc0;border-radius:13px;background:linear-gradient(145deg,#08152e,#080b20 75%,#130b2a);box-shadow:0 0 14px #087cff20,inset 0 0 15px #872aff0b;overflow:hidden}.feature{padding:11px}.feature-head{display:flex;gap:10px;align-items:center;padding:4px 4px 10px}.feature-head .bigicon{font-size:34px}.feature-head h1{font-size:clamp(21px,2.2vw,32px);margin:0}.feature-head p{margin:3px 0 0;color:#b9d5ff;font-size:clamp(11px,1.1vw,15px)}.heroart{height:clamp(180px,35vh,420px);position:relative;border:1px solid #1768b6;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#080d38,#16134e 40%,#060b20);display:flex;align-items:center;justify-content:center}.skyline{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:0 4% 0;background:radial-gradient(ellipse at 50% 75%,#6c20a9aa,transparent 55%),linear-gradient(180deg,#090d32,#11194b 60%,#05091b)}.tower{width:8%;height:var(--h);background:repeating-linear-gradient(0deg,transparent 0 12px,#30ddff99 13px 15px),linear-gradient(90deg,#071329,#172e63,#080d25);border:1px solid #1b69d5;box-shadow:0 0 13px #16bfff77;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}.tower:nth-child(2n){background:repeating-linear-gradient(0deg,transparent 0 10px,#f44aff99 11px 13px),linear-gradient(90deg,#120b2e,#3c1a68,#080d25)}.heroobject{position:relative;z-index:2;text-align:center;filter:drop-shadow(0 0 22px #20cfff88)}.heroobject .emoji{font-size:clamp(75px,12vw,160px);line-height:1.15}.heroobject h2{font-size:clamp(19px,2.3vw,31px);margin:0;text-shadow:0 0 15px #00bfff}.heroobject p{color:#c6d9ff;margin:5px}.hero-badge{position:absolute;left:12px;bottom:12px;z-index:3;background:#03091cdd;border:1px solid var(--cyan);border-radius:9px;padding:8px 12px;font-weight:800;color:var(--cyan)}.hero-badge.right{left:auto;right:12px;color:var(--gold);border-color:var(--purple)}.current-card{display:flex;align-items:center;gap:12px;padding:10px;margin-top:9px;border:1px solid #302f89;border-radius:10px;background:linear-gradient(100deg,#090f29,#180c30)}.current-card .houseico{font-size:40px}.current-card .grow{flex:1;min-width:0}.current-card small{color:#b5c9e9;display:block}.current-card strong{display:block;font-size:clamp(15px,1.7vw,22px)}.owned{background:linear-gradient(100deg,#00c96b,#086a47);border:1px solid #20e875;border-radius:9px;padding:10px 16px;font-weight:900;box-shadow:0 0 12px #20e87566}.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.perk{padding:9px 4px;text-align:center;border:1px solid #1d4d99;border-radius:8px;background:#070f26;font-size:clamp(9px,.95vw,13px)}.rightpanel{padding:10px}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}.tab{padding:11px 4px;border:1px solid #1269bd;border-radius:9px;background:#07152c;font-weight:800;font-size:clamp(11px,1.1vw,15px)}.tab.active{background:linear-gradient(100deg,#0055dc,#6314d7);border-color:var(--cyan);box-shadow:0 0 12px #087cff88}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{border:1px solid #1479c9;border-radius:9px;background:linear-gradient(180deg,#101633,#060b1a);overflow:hidden;min-width:0;text-align:center}.itemart{height:clamp(65px,11vh,130px);display:grid;place-items:center;font-size:clamp(35px,5vw,65px);background:radial-gradient(ellipse at 50% 100%,#3e2578,#081329 70%);border-bottom:1px solid #12529b}.item strong{display:block;font-size:clamp(11px,1.1vw,15px);padding:5px 3px 1px}.item small{display:block;color:#b9c9e5;padding:0 3px 5px;font-size:10px}.item button{margin:0 5px 7px;width:calc(100% - 10px);padding:7px 2px;border:1px solid #087dff;border-radius:7px;background:linear-gradient(90deg,#0756b8,#4a13a5);font-size:11px;font-weight:900}.item button:disabled{opacity:.5}.bottomnav{display:none}.mobilebar{display:none}.tilegrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{padding:10px;text-align:center}.tile .ticon{font-size:34px}.tile h3{font-size:13px;margin:3px}.tile p{font-size:11px;color:var(--muted);margin:4px}.tile button{width:100%;margin-top:6px;padding:8px;border:1px solid #087cff;border-radius:8px;background:#0b2350;font-weight:800;font-size:11px}.activity{grid-column:1/-1;padding:10px}.activity h3{margin:0 0 6px;font-size:14px}.activityrow{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-top:1px solid #17284a;font-size:12px}.muted{color:var(--muted)}.green{color:var(--green)}.gold{color:var(--gold)}.btn{border:1px solid var(--cyan);border-radius:9px;padding:10px 14px;background:linear-gradient(100deg,#0764ca,#6318c6);font-weight:900}.btn.secondary{background:#08152d;border-color:#3464aa}.rowbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.avatar-preview{min-height:200px;display:grid;place-items:center;background:radial-gradient(ellipse,#27206b,#070e20 70%);border:1px solid #1a62b4;border-radius:10px}.avatar-person{font-size:clamp(85px,12vw,150px);filter:drop-shadow(0 0 16px #42f5ff66)}.custom-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.control{padding:10px;border:1px solid #1b579b;border-radius:9px;background:#07132b}.control label{display:block;color:#b7c8e5;font-size:11px;margin-bottom:5px}.control select,.control input{width:100%;color:#fff;background:#0d1c3a;border:1px solid #315b94;border-radius:6px;padding:8px}.notice{border:1px solid #7053bf;background:#171039;border-radius:9px;padding:9px;color:#d9d2ff;font-size:12px;margin-top:8px}
@media(max-width:850px){body{padding:5px 6px calc(65px + env(safe-area-inset-bottom))}.topbar{grid-template-columns:minmax(110px,1fr) repeat(3,minmax(72px,.75fr));gap:5px}.back{display:none}.brand{grid-column:1/2;grid-row:1;font-size:13px}.brand span{font-size:8px}.stat{padding:5px 3px;gap:3px;flex-direction:column}.stat .ico{font-size:19px}.stat strong{font-size:11px}.stat small{font-size:8px}.levelbox{grid-column:1/-1;grid-row:2;padding:5px 9px}.crown{font-size:18px;padding:4px}.layout{display:block}.sidebar{display:none}.main{grid-template-columns:minmax(0,1fr);gap:7px}.feature{padding:8px}.feature-head{padding-bottom:7px}.feature-head .bigicon{font-size:27px}.heroart{height:30vh;min-height:160px}.rightpanel{padding:8px}.itemart{height:80px}.tilegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.perks{grid-template-columns:repeat(2,minmax(0,1fr))}.bottomnav{display:flex;position:fixed;z-index:50;left:6px;right:6px;bottom:max(5px,env(safe-area-inset-bottom));padding:5px 3px;gap:2px;border:1px solid #5388d0;border-radius:14px;background:#050d20f5;box-shadow:0 0 18px #087cff66;justify-content:space-around;backdrop-filter:blur(14px)}.bottomnav button{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;background:transparent;padding:5px 1px;color:#c5d4ef;font-size:9px}.bottomnav button span{display:block;font-size:19px;margin-bottom:2px}.bottomnav button.active{border-color:var(--cyan);background:#102b60;color:#fff;box-shadow:0 0 10px #42f5ff77}.mobilebar{display:flex;gap:6px;overflow:auto;margin-bottom:7px}.mobilebar button{white-space:nowrap;padding:7px 10px;border:1px solid #1764b3;border-radius:8px;background:#08152e;font-size:11px}.custom-controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(orientation:landscape) and (max-height:600px){body{padding:5px 7px}.topbar{grid-template-columns:100px minmax(130px,1.1fr) repeat(3,minmax(100px,.8fr)) minmax(160px,1fr);gap:5px;margin-bottom:5px}.brand{font-size:15px}.brand span{font-size:8px}.stat{padding:4px}.stat .ico{font-size:23px}.stat strong{font-size:13px}.levelbox{padding:4px}.crown{font-size:18px;padding:5px}.layout{grid-template-columns:145px minmax(0,1fr);gap:6px}.sidebar{gap:4px}.nav{padding:5px 7px;min-height:34px;font-size:12px;gap:6px}.nav .icon{font-size:19px;width:23px}.main{grid-template-columns:minmax(0,1.4fr) minmax(230px,.85fr);gap:6px}.feature,.rightpanel{padding:7px}.feature-head{padding-bottom:5px}.feature-head .bigicon{font-size:25px}.heroart{height:34vh;min-height:120px}.heroobject .emoji{font-size:75px}.itemart{height:65px}.item button{padding:5px}.tilegrid{gap:5px}.tile{padding:6px}.bottomnav{display:none}}
@media(orientation:portrait) and (max-width:850px){#rotateOverlay{display:flex}}
#rotateOverlay{display:none;position:fixed;z-index:1000;inset:0;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 35%,#1a2768,#030612 75%);padding:22px}
.rotatecard{max-width:360px;padding:24px;border:1px solid var(--cyan);border-radius:20px;background:#09132bf2;box-shadow:0 0 25px #087cff66}.rotatecard .phone{font-size:55px}.rotatecard h2{margin:8px 0}.rotatecard p{color:var(--muted);line-height:1.45}.rotatecard button{padding:10px 16px;border-radius:9px;border:1px solid var(--cyan);background:#10285b;font-weight:800}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1100;padding:10px 16px;border:1px solid var(--cyan);border-radius:9px;background:#07162e;box-shadow:0 0 15px #087cff77;display:none}
</style>
</head>
<body>
<div id="rotateOverlay"><div class="rotatecard"><div class="phone">📱 ↻</div><h2>Turn your phone sideways</h2><p>This tycoon is designed for landscape play. Rotate your iPhone to see the full neon city dashboard.</p><button onclick="document.getElementById('rotateOverlay').style.display='none'">Continue anyway</button></div></div>
<div id="toast" class="toast"></div>
<div class="app">
<header class="topbar">
<button class="back" onclick="navigate('home')">‹ Back</button>
<div class="brand">🌆 <div>START FROM THE BOTTOM<span>TYCOON</span></div></div>
<div class="stat"><span class="ico">💵</span><div><strong id="cash">$0</strong><small>CASH</small></div></div>
<div class="stat income"><span class="ico">📈</span><div><strong id="income">$0</strong><small>INCOME/SEC</small></div></div>
<div class="stat life"><span class="ico">👑</span><div><strong id="lifetime">$0</strong><small>LIFETIME</small></div></div>
<div class="levelbox"><div class="crown">👑</div><div style="flex:1;min-width:0"><strong id="rank">LEVEL 1 · ROOKIE</strong><small id="xpText">0 / 100 XP</small><div class="xp"><span id="xpFill"></span></div></div></div>
</header>
<div class="layout"><aside id="sidebar" class="sidebar"></aside><main id="main" class="main"></main></div>
<nav id="bottomnav" class="bottomnav"></nav>
</div>
<script>
const $=id=>document.getElementById(id);
const navItems=[["home","🏠","Home"],["businesses","🏪","Businesses"],["areas","🗺️","Areas"],["house","🏡","House"],["vehicles","🚘","Vehicles"],["avatar","🧍","Avatar"],["achievements","🏆","Achievements"],["rewards","🎁","Rewards"],["empire","👑","Empire"],["city","🏙️","City Control"],["crime","🚨","Crime & Risk"]];
const fresh=()=>({cash:0,lifetime:0,level:1,xp:0,businesses:[],upgrades:[],area:0,house:0,cars:[],projects:[],achievements:[],daily:"",streak:0,prestige:0,gender:"male",skin:"medium",hair:"curly",hairColor:"black",top:"hoodie",pants:"cargo",shoes:"sneakers",accessories:[],outfit:"Streetwear",crimeRisk:8,lastWork:0,activity:[]});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem("sbt_neon_rebuild_v1")||"{}")}}catch(e){s=fresh()}
let page="home",tab="houses";
const businesses=[["Corner Store","🏪",250,2],["Food Truck","🚚",900,8],["Sneaker Shop","👟",3500,24],["Car Wash","🚿",12000,75],["Nightclub","🎧",50000,280],["Luxury Hotel","🏨",250000,1250],["Tech Company","💻",1200000,6000],["Skyline Tower","🏙️",6000000,30000]];
const areas=[["The Bottom","🏚️",0,0],["Downtown","🌆",2500,2],["Neon District","🌃",25000,5],["Harbor Point","🌉",200000,10],["Uptown Heights","🏙️",1500000,20],["Golden Coast","🌴",12000000,35],["Skyline Elite","🚀",100000000,60]];
const houses=[["Starter House","🏠",0,"Starter home"],["Suburban House","🏡",25000,"Room to grow"],["Modern House","🏘️",100000,"Garage and smart home"],["Luxury Villa","🏰",500000,"Pool and private garden"],["Mansion","🏛️",1500000,"A symbol of success"],["Hidden Hills Mansion","🌴",8000000,"Private estate · Level 20"],["Penthouse","🌃",30000000,"Skyline views · Level 35"],["Beach Mansion","🌊",100000000,"Ultimate coastal estate · Level 50"]];
const cars=[["Street Coupe","🏎️",0],["Night SUV","🚙",85000],["Luxury Sedan","🚘",120000],["Supercar","🏎️",250000],["Hypercar","🚀",2500000],["Neon Bike","🏍️",15000]];
const projects=[["Street Lighting","💡",5000,1],["Transit Network","🚇",35000,5],["Tech Hub","🛰️",250000,10],["Skyline Expansion","🏗️",2000000,20]];
const rewards=[500,1000,1750,2500,4000,6500,10000];
function save(){localStorage.setItem("sbt_neon_rebuild_v1",JSON.stringify(s))}
function fmt(n){n=Math.floor(n||0);if(n>=1e9)return "$"+(n/1e9).toFixed(2)+"B";if(n>=1e6)return "$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return "$"+(n/1e3).toFixed(1)+"K";return "$"+n.toLocaleString()}
function income(){return s.businesses.reduce((n,id)=>n+businesses[id][3]*(s.upgrades.includes(id)?1.5:1),0)*(1+s.prestige*.25)*(s.house>=2?1.25:1)+(s.projects.length*5)}
function xpNeed(){return 100+(s.level-1)*75}
function log(text,icon="✨",value=""){s.activity.unshift({text,icon,value});s.activity=s.activity.slice(0,6)}
function toast(t){let el=$("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",1800)}
function levelUp(){while(s.xp>=xpNeed()){s.xp-=xpNeed();s.level++;toast("LEVEL UP! Level "+s.level);log("Reached level "+s.level,"⭐")}}
function work(){let reward=20+s.level*5;s.cash+=reward;s.lifetime+=reward;s.xp+=12;levelUp();log("Worked a shift","💼","+"+fmt(reward));save();render();toast("Shift complete: +"+fmt(reward))}
function navMarkup(cls){return navItems.map(([id,icon,label])=>`<button class="${cls} ${page===id?"active":""}" onclick="navigate('${id}')"><span>${icon}</span>${label}</button>`).join("")}
function renderHeader(){$("cash").textContent=fmt(s.cash);$("income").textContent=fmt(income());$("lifetime").textContent=fmt(s.lifetime);$("rank").textContent="LEVEL "+s.level+" · "+(s.level<5?"ROOKIE":s.level<15?"HUSTLER":s.level<30?"BOSS":"EMPIRE BUILDER");$("xpText").textContent=s.xp+" / "+xpNeed()+" XP";$("xpFill").style.width=Math.min(100,s.xp/xpNeed()*100)+"%";$("sidebar").innerHTML=navItems.map(([id,icon,label])=>`<button class="nav ${page===id?"active":""}" onclick="navigate('${id}')"><span class="icon">${icon}</span>${label}</button>`).join("");$("bottomnav").innerHTML=navItems.slice(0,8).map(([id,icon,label])=>`<button class="${page===id?"active":""}" onclick="navigate('${id}')"><span>${icon}</span>${label==="Businesses"?"Biz":label==="Achievements"?"Trophies":label}</button>`).join("")}
function skyline(){return `<div class="skyline">${[36,55,72,48,88,62,43,78,52,68,39].map(h=>`<div class="tower" style="--h:${h}%"></div>`).join("")}</div>`}
function art(icon,title,subtitle,badge="YOUR EMPIRE"){return `<div class="heroart">${skyline()}<div class="heroobject"><div class="emoji">${icon}</div><h2>${title}</h2><p>${subtitle}</p></div><div class="hero-badge">${badge}</div><div class="hero-badge right">👑 LEVEL ${s.level}</div></div>`}
function itemCard(icon,name,price,desc,action,disabled=false,label="Buy"){return `<article class="item"><div class="itemart">${icon}</div><strong>${name}</strong><small>${desc||price}</small><button onclick="${action}" ${disabled?"disabled":""}>${label}</button></article>`}
function shell(icon,title,subtitle,left,badges,rightTitle,rightContent){return `<section class="feature"><div class="feature-head"><span class="bigicon">${icon}</span><div><h1>${title}</h1><p>${subtitle}</p></div></div>${art(icon,title,subtitle,left)}<div class="current-card"><span class="houseico">${icon}</span><div class="grow"><small>YOUR PROGRESS</small><strong>${title}</strong><small>${subtitle}</small></div><span class="owned">${badges}</span></div><div class="perks"><div class="perk">📈 <b>Income</b></div><div class="perk">🔓 <b>Unlocks</b></div><div class="perk">🏆 <b>Progress</b></div><div class="perk">👑 <b>Status</b></div></div></section><section class="rightpanel"><div class="tabs"><button class="tab active">${rightTitle}</button><button class="tab" onclick="navigate('businesses')">Upgrades</button><button class="tab" onclick="navigate('empire')">Empire</button></div><div class="cards">${rightContent}</div></section>`}
function renderHome(){let house=houses[s.house]||houses[0];let houseCards=houses.map((h,i)=>itemCard(h[1],h[0],fmt(h[2]),i===s.house?"✓ Owned":h[3],`buyHouse(${i})`,i===s.house||s.cash<h[2]||(i>=5&&s.level<(i===5?20:i===6?35:50)),i===s.house?"Owned":s.cash<h[2]?"Locked · "+fmt(h[2]):"Buy")).join("");$("main").innerHTML=shell("🏡","House","Upgrade your house to unlock new looks, benefits, and status.","PROPERTY","✓ "+house[0],"Houses",houseCards)+`<section class="tilegrid"><article class="tile"><div class="ticon">💼</div><h3>Work a Shift</h3><p>Earn cash and XP to build your empire.</p><button onclick="work()">Work · +${fmt(20+s.level*5)}</button></article><article class="tile"><div class="ticon">🧍</div><h3>Avatar & Style</h3><p>Make your own look.</p><button onclick="navigate('avatar')">Customize</button></article><article class="tile"><div class="ticon">🎁</div><h3>Daily Rewards</h3><p>${s.daily===new Date().toDateString()?"Already claimed today":"Claim a daily bonus"}</p><button onclick="navigate('rewards')">Open Rewards</button></article><article class="tile"><div class="ticon">🚨</div><h3>Crime & Risk</h3><p>Fictional high-risk game events.</p><button onclick="navigate('crime')">Open</button></article></section><section class="activity"><h3>📋 RECENT ACTIVITY</h3>${s.activity.slice(0,4).map(a=>`<div class="activityrow"><span>${a.icon} ${a.text}</span><b class="green">${a.value}</b></div>`).join("")||'<p class="muted">Your story starts with your first shift.</p>'}</section>`}
function renderBusinesses(){let cards=businesses.map((b,i)=>{let owned=s.businesses.includes(i);return itemCard(b[1],b[0],fmt(b[2]),owned?"Income "+fmt(b[3])+"/sec":fmt(b[2])+" · +"+fmt(b[3])+"/sec",`buyBusiness(${i})`,owned||s.cash<b[2],owned?"Owned":s.cash<b[2]?"Need "+fmt(b[2]):"Buy")+(owned?`<button onclick="upgradeBusiness(${i})" ${s.upgrades.includes(i)||s.cash<Math.ceil(b[2]*.65)?"disabled":""}>${s.upgrades.includes(i)?"Upgraded":"Upgrade · "+fmt(Math.ceil(b[2]*.65))}</button>`:"")}).join("");$("main").innerHTML=shell("🏪","Businesses","Build a portfolio of businesses that earn while you play.","BUSINESS DISTRICT",s.businesses.length+" OWNED","Businesses",cards)}
function renderAreas(){let cards=areas.map((a,i)=>itemCard(a[1],a[0],i<=s.area?"Unlocked":"Level "+a[3],i<=s.area?"Your territory":"Cost "+fmt(a[2]),`buyArea(${i})`,i<=s.area||i!==s.area+1||s.level<a[3]||s.cash<a[2],i<=s.area?"Owned":s.level<a[3]?"Need level "+a[3]:s.cash<a[2]?"Locked":"Unlock · "+fmt(a[2]))).join("");$("main").innerHTML=shell("🗺️","Areas","Expand your empire district by district.","CITY MAP","AREA "+(s.area+1),"Districts",cards)}
function renderHouse(){let cards=houses.map((h,i)=>itemCard(h[1],h[0],fmt(h[2]),i===s.house?"✓ Owned":h[3],`buyHouse(${i})`,i===s.house||s.cash<h[2]||(i>=5&&s.level<(i===5?20:i===6?35:50)),i===s.house?"Owned":s.cash<h[2]?"Need "+fmt(h[2]):"Buy")).join("");$("main").innerHTML=shell("🏡","House","Upgrade your house to unlock new looks, benefits, and status.","LIFESTYLE","✓ "+houses[s.house][0],"Houses",cards)}
function renderVehicles(){let cards=cars.map((c,i)=>itemCard(c[1],c[0],fmt(c[2]),s.cars.includes(i)?"In your garage":"Collect a ride",`buyCar(${i})`,s.cars.includes(i)||s.cash<c[2],s.cars.includes(i)?"Owned":s.cash<c[2]?"Need "+fmt(c[2]):"Buy")).join("");$("main").innerHTML=shell("🚘","Vehicles","Build a garage that matches your growing empire.","GARAGE",s.cars.length+" VEHICLES","Vehicles",cards)}
function renderAvatar(){let person=s.gender==="male"?"🧑🏻‍💼":"👩🏽‍💼";let cards=[["👕","Streetwear","top","hoodie"],["🧥","Business Suit","top","suit"],["🧢","Cap","accessory","cap"],["🕶️","Sunglasses","accessory","glasses"],["💎","Gold Chain","accessory","chain"],["👟","Sneakers","shoes","sneakers"],["⌚","Luxury Watch","accessory","watch"],["🎩","Designer Hat","accessory","hat"]].map(c=>itemCard(c[0],c[1],"Style",s[c[2]]===c[3]||s.accessories.includes(c[3])?"Equipped":"Customize",`wear('${c[2]}','${c[3]}')`,false,s[c[2]]===c[3]||s.accessories.includes(c[3])?"Equipped":"Wear")).join("");$("main").innerHTML=`<section class="feature"><div class="feature-head"><span class="bigicon">👕</span><div><h1>Avatar & Style</h1><p>Build your look. Switch characters whenever you want.</p></div></div><div class="avatar-preview"><div class="avatar-person">${person}</div><h2>${s.gender==="male"?"Male":"Female"} · ${s.outfit}</h2></div><div class="rowbuttons"><button class="btn" onclick="setGender('male')">♂ Male</button><button class="btn" onclick="setGender('female')">♀ Female</button><button class="btn secondary" onclick="randomStyle()">🎲 Random style</button></div><div class="custom-controls"><div class="control"><label>Skin tone</label><select onchange="setField('skin',this.value)"><option value="light" ${s.skin==="light"?"selected":""}>Light</option><option value="medium" ${s.skin==="medium"?"selected":""}>Medium</option><option value="tan" ${s.skin==="tan"?"selected":""}>Tan</option><option value="deep" ${s.skin==="deep"?"selected":""}>Deep</option></select></div><div class="control"><label>Hair style</label><select onchange="setField('hair',this.value)"><option value="curly">Curly</option><option value="fade">Fade</option><option value="braids">Braids</option><option value="long">Long</option></select></div><div class="control"><label>Hair color</label><select onchange="setField('hairColor',this.value)"><option value="black">Black</option><option value="brown">Brown</option><option value="blonde">Blonde</option><option value="purple">Neon purple</option></select></div><div class="control"><label>Preset outfit</label><select onchange="setField('outfit',this.value)"><option>Streetwear</option><option>Businessman</option><option>Luxury</option><option>Neon Legend</option></select></div></div><div class="notice">Exclusive outfits and premium looks can be unlocked as you level up. This version uses illustrated emoji-style previews; detailed layered character artwork is a future visual upgrade.</div></section><section class="rightpanel"><div class="tabs"><button class="tab active">Style Shop</button><button class="tab" onclick="randomStyle()">Random</button><button class="tab" onclick="saveOutfit()">Save Look</button></div><div class="cards">${cards}</div></section>`}
function renderAchievements(){let list=[["First Steps","Work your first shift","s.lifetime>=25","🏁"],["Entrepreneur","Own 3 businesses","s.businesses.length>=3","🏪"],["Property Owner","Buy a better home","s.house>=1","🏡"],["District Boss","Unlock Downtown","s.area>=1","🗺️"],["Millionaire","Reach $1 million lifetime","s.lifetime>=1000000","💰"],["Fashion Icon","Customize your avatar","s.outfit!=='Streetwear'","👕"]];let cards=list.map(a=>{let done=!!eval(a[2]);return `<article class="item"><div class="itemart">${a[3]}</div><strong>${a[0]}</strong><small>${a[1]}</small><button ${done?"disabled":""} onclick="claimAchievement('${a[0]}')">${done?"✓ Complete":"Reward · $500"}</button></article>`}).join("");$("main").innerHTML=shell("🏆","Achievements","Every milestone brings you closer to the top.","TROPHY ROOM",s.achievements.length+" UNLOCKED","Milestones",cards)}
function renderRewards(){let claimed=s.daily===new Date().toDateString();let next=Math.min(7,(s.streak||0)+1);let cards=rewards.map((r,i)=>itemCard("🎁","Day "+(i+1),fmt(r),"Daily login bonus",`claimDaily(${i})`,claimed||i!==next-1,claimed&&i===next-1?"Claimed":i===next-1?"Claim reward":i<next-1?"Collected":"Upcoming")).join("");$("main").innerHTML=shell("🎁","Daily Rewards","Return each day to build your streak and earn bonuses.","REWARD CENTER",claimed?"CLAIMED TODAY":"DAY "+next,"7-Day Streak",cards)}
function renderEmpire(){let cards=[["Prestige","♻️",s.level>=10?0:99999999,"Reset for a permanent income bonus"],["Luxury Lifestyle","💎",50000,"Show off your growing wealth"],["Empire Expansion","🏙️",250000,"Increase your empire score"],["Legacy Fund","👑",1000000,"A long-term prestige goal"]].map((a,i)=>itemCard(a[1],a[0],i===0?"Level 10":fmt(a[2]),a[3],i===0?"prestige()":`buyProject(${i})`,i===0?s.level<10:s.cash<a[2],i===0?"Prestige":s.cash<a[2]?"Locked":"Invest")).join("");$("main").innerHTML=shell("👑","Empire","Turn your progress into a lasting legacy.","EMPIRE HQ","PRESTIGE "+s.prestige,"Empire Goals",cards)}
function renderCity(){let cards=projects.map((p,i)=>itemCard(p[1],p[0],fmt(p[2]),s.projects.includes(i)?"City upgrade installed":"Income boost +"+fmt(p[3])+"/sec",`buyProject(${i})`,s.projects.includes(i)||s.cash<p[2]||s.level<p[3],s.projects.includes(i)?"Built":s.level<p[3]?"Level "+p[3]:s.cash<p[2]?"Need "+fmt(p[2]):"Build")).join("");$("main").innerHTML=shell("🏙️","City Control","Invest in infrastructure to strengthen your territory.","CITY PROJECTS",s.projects.length+" BUILT","Development",cards)}
function renderCrime(){let cards=[["Risky Delivery","📦",100,350,"delivery"],["Underground Race","🏁",300,950,"race"],["Black-Market Deal","🧳",1200,3500,"deal"]].map(c=>itemCard(c[1],c[0],"Risk "+s.crimeRisk+"%",`Possible reward ${fmt(c[3])}`,`crime('${c[4]}',${c[2]},${c[3]})`,s.cash<c[2],"Try event")).join("");$("main").innerHTML=shell("🚨","Crime & Risk","Fictional game events: rewards are never guaranteed.","RISK DISTRICT",s.crimeRisk+"% RISK","Risk Events",cards)+`<section class="activity"><h3>⚠️ Risk Meter</h3><p class="muted">Risk rises after events and slowly cools down. This is fictional gameplay only.</p><button class="btn secondary" onclick="coolRisk()">Lay low · $0</button></section>`}
function render(){renderHeader();({home:renderHome,businesses:renderBusinesses,areas:renderAreas,house:renderHouse,vehicles:renderVehicles,avatar:renderAvatar,achievements:renderAchievements,rewards:renderRewards,empire:renderEmpire,city:renderCity,crime:renderCrime}[page]||renderHome)();renderHeader()}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function buyBusiness(i){let b=businesses[i];if(s.businesses.includes(i)||s.cash<b[2])return;s.cash-=b[2];s.businesses.push(i);s.xp+=30;levelUp();log("Bought "+b[0],"🏪","-"+fmt(b[2]));save();render();toast("Business purchased!")}
function upgradeBusiness(i){let cost=Math.ceil(businesses[i][2]*.65);if(s.cash<cost||s.upgrades.includes(i))return;s.cash-=cost;s.upgrades.push(i);s.xp+=20;levelUp();log("Upgraded "+businesses[i][0],"📈","-"+fmt(cost));save();render()}
function buyArea(i){let a=areas[i];if(i!==s.area+1||s.level<a[3]||s.cash<a[2])return;s.cash-=a[2];s.area=i;s.xp+=45;levelUp();log("Unlocked "+a[0],"🗺️","-"+fmt(a[2]));save();render();toast("New area unlocked!")}
function buyHouse(i){let h=houses[i];if(i===s.house||s.cash<h[2]||(i>=5&&s.level<(i===5?20:i===6?35:50)))return;s.cash-=h[2];s.house=i;s.xp+=35;levelUp();log("Purchased "+h[0],"🏡","-"+fmt(h[2]));save();render();toast("Property purchased!")}
function buyCar(i){let c=cars[i];if(s.cars.includes(i)||s.cash<c[2])return;s.cash-=c[2];s.cars.push(i);s.xp+=20;levelUp();log("Added "+c[0]+" to garage","🚘","-"+fmt(c[2]));save();render()}
function setGender(g){s.gender=g;save();render()}
function setField(k,v){s[k]=v;save();render()}
function wear(k,v){if(k==="accessory"){if(s.accessories.includes(v))s.accessories=s.accessories.filter(x=>x!==v);else s.accessories.push(v)}else s[k]=v;s.outfit="Custom";save();render();toast("Style updated")}
function randomStyle(){s.gender=Math.random()>.5?"male":"female";s.hair=["curly","fade","braids","long"][Math.floor(Math.random()*4)];s.hairColor=["black","brown","blonde","purple"][Math.floor(Math.random()*4)];s.top=["hoodie","suit"][Math.floor(Math.random()*2)];s.pants="cargo";s.shoes="sneakers";s.outfit="Custom";save();render()}
function saveOutfit(){save();toast("Outfit saved!")}
function claimAchievement(name){if(s.achievements.includes(name))return;s.achievements.push(name);s.cash+=500;s.lifetime+=500;log("Achievement: "+name,"🏆","+ $500");save();render()}
function claimDaily(i){if(s.daily===new Date().toDateString())return;let expected=Math.min(7,(s.streak||0)+1);if(i!==expected-1)return;let amount=rewards[i];s.cash+=amount;s.lifetime+=amount;s.daily=new Date().toDateString();s.streak=expected;s.xp+=25;levelUp();log("Daily reward claimed","🎁","+"+fmt(amount));save();render();toast("Daily reward: "+fmt(amount))}
function buyProject(i){let p=projects[i];if(s.projects.includes(i)||s.cash<p[2]||s.level<p[3])return;s.cash-=p[2];s.projects.push(i);s.xp+=50;levelUp();log("Completed "+p[0],"🏙️","-"+fmt(p[2]));save();render()}
function prestige(){if(s.level<10){toast("Reach level 10 to prestige");return}if(!confirm("Prestige resets cash, businesses, properties, vehicles and levels in exchange for a permanent +25% income bonus. Continue?"))return;s.prestige++;let old={gender:s.gender,skin:s.skin,hair:s.hair,hairColor:s.hairColor,top:s.top,pants:s.pants,shoes:s.shoes,accessories:s.accessories};s={...fresh(),...old,prestige:s.prestige};log("Prestiged: permanent income bonus gained","♻️");save();render();toast("Prestige complete!")}
function crime(name,cost,reward){if(s.cash<cost)return;s.cash-=cost;let success=Math.random()>.35+s.crimeRisk/160;if(success){s.cash+=reward;s.lifetime+=reward;s.xp+=15;log("Won "+name+" event","🚨","+"+fmt(reward));toast("Event success!")}else{let fine=Math.min(s.cash,Math.ceil(cost*.6));s.cash-=fine;s.crimeRisk=Math.min(95,s.crimeRisk+12);log(name+" event failed","🚔","-"+fmt(fine));toast("Caught! Risk increased.")}levelUp();save();render()}
function coolRisk(){s.crimeRisk=Math.max(5,s.crimeRisk-8);save();render();toast("Risk cooled down")}
function dailyTick(){let now=Date.now();if(s.lastWork&&now-s.lastWork>1000){let earned=Math.floor(income()*Math.min(3600,(now-s.lastWork)/1000));if(earned>0){s.cash+=earned;s.lifetime+=earned;log("Business income collected","📈","+"+fmt(earned))}}s.lastWork=now;save();renderHeader()}
setInterval(dailyTick,15000);render();
</script>
</body>
</html>
